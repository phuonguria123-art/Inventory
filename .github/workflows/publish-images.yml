name: Publish Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./aspnet-core
          file: ./aspnet-core/Dockerfile
          push: true
          tags: |
            ghcr.io/phuonguria123-art/inventory-api:latest
            ghcr.io/phuonguria123-art/inventory-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=inventory-api
          cache-to: type=gha,mode=max,scope=inventory-api

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./angular/inventory
          file: ./angular/inventory/Dockerfile
          push: true
          tags: |
            ghcr.io/phuonguria123-art/inventory-frontend:latest
            ghcr.io/phuonguria123-art/inventory-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=inventory-frontend
          cache-to: type=gha,mode=max,scope=inventory-frontend
          