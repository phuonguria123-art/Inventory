name: Inventory Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  backend-ci:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore aspnet-core/NotFound.sln

      - name: Build backend
        run: dotnet build aspnet-core/InventoryManagement.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test aspnet-core/InventoryManagement.sln --configuration Release --no-build

  frontend-ci:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular/inventory

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular/inventory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production
        
  docker-ci:
    name: Build Docker images
    runs-on: ubuntu-latest

    needs:
      - backend-ci
      - frontend-ci

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build backend image
      uses: docker/build-push-action@v7
      with:
        context: ./aspnet-core
        file: ./aspnet-core/Dockerfile
        push: false
        tags: inventory-api:ci
        cache-from: type=gha,scope=inventory-api
        cache-to: type=gha,mode=max,scope=inventory-api

    - name: Build frontend image
      uses: docker/build-push-action@v7
      with:
        context: ./angular/inventory
        file: ./angular/inventory/Dockerfile
        push: false
        tags: inventory-frontend:ci
        build-args: |
          FRONTEND_URL=http://localhost:4200
          API_URL=http://localhost:7081
        cache-from: type=gha,scope=inventory-frontend
        cache-to: type=gha,mode=max,scope=inventory-frontend
