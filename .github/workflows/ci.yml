name: Inventory Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore aspnet-core/InventoryManagement.sln

      - name: Build backend
        run: dotnet build aspnet-core/InventoryManagement.sln --configuration Release --no-restore

      - name: Test backend
        run: dotnet test aspnet-core/InventoryManagement.sln --configuration Release --no-build

  frontend-ci:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular/inventory

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular/inventory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production
