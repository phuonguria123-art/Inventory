<section class="form-page">
  <header class="form-header">
    <div><a routerLink="/supplier">← Quay lại danh sách</a><h2>{{ mode === 'create' ? 'Thêm nhà cung cấp' : mode === 'edit' ? 'Cập nhật nhà cung cấp' : 'Chi tiết nhà cung cấp' }}</h2><p>Thông tin doanh nghiệp và người đại diện liên hệ.</p></div>
    @if (mode === 'view') { <button type="button" class="secondary-button" (click)="enableEdit()">Chỉnh sửa</button> }
  </header>

  <form class="form-card" [formGroup]="supplierForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <label><span>Tên nhà cung cấp <b>*</b></span><input formControlName="name" placeholder="Nhập tên nhà cung cấp">@if (supplierForm.controls.name.touched && supplierForm.controls.name.invalid) { <small>Vui lòng nhập tên nhà cung cấp.</small> }</label>
      <label><span>Mã nhà cung cấp <b>*</b></span><input formControlName="code" placeholder="Ví dụ: SUP-001"></label>
      <label><span>Người liên hệ <b>*</b></span><input formControlName="contactPerson" placeholder="Họ và tên người liên hệ"></label>
      <label><span>Số điện thoại <b>*</b></span><input formControlName="phone" placeholder="0901234567">@if (supplierForm.controls.phone.touched && supplierForm.controls.phone.invalid) { <small>Số điện thoại không đúng định dạng.</small> }</label>
      <label class="full"><span>Email <b>*</b></span><input type="email" formControlName="email" placeholder="contact@company.com">@if (supplierForm.controls.email.touched && supplierForm.controls.email.invalid) { <small>Email không đúng định dạng.</small> }</label>
      <label class="full"><span>Địa chỉ <b>*</b></span><textarea formControlName="address" rows="4" placeholder="Nhập địa chỉ nhà cung cấp"></textarea></label>
    </div>
    @if (mode !== 'view') { <footer class="form-actions"><a routerLink="/supplier">Hủy</a><button type="submit" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Đang lưu...' : mode === 'create' ? 'Tạo nhà cung cấp' : 'Lưu thay đổi' }}</button></footer> }
  </form>
</section>
